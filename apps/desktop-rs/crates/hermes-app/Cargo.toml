[package]
name = "hermes-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hermes-companion"
path = "src/main.rs"

[features]
# Compile Metal shaders at runtime via macOS's built-in Metal framework so
# `cargo run` works with only Xcode Command Line Tools (no full Xcode required).
# For release AOT metallib compilation with full Xcode, pass `--no-default-features`.
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
hermes-gateway = { path = "../hermes-gateway" }
hermes-git = { path = "../hermes-git" }
hermes-protocol = { path = "../hermes-protocol" }
hermes-terminal = { path = "../hermes-terminal" }
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }
syntect = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
